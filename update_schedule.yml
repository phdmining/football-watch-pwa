name: Trigger Backend Refresh

on:
  schedule:
    # 每天 UTC 06:00 跑一次（可自行调整，UTC时间要自己换算成你想要的当地时间）
    - cron: '0 6 * * *'
  workflow_dispatch: {}   # 也支持在GitHub网页上手动点一下立即跑一次

jobs:
  trigger-refresh:
    runs-on: ubuntu-latest
    steps:
      - name: 触发后端刷新，并持续轮询直到跑完
        env:
          BACKEND_URL: ${{ secrets.BACKEND_URL }}
          REFRESH_TOKEN: ${{ secrets.REFRESH_TOKEN }}
        run: |
          echo "触发 $BACKEND_URL/api/refresh ..."
          trigger_status=$(curl -s -o /dev/null -w "%{http_code}" --max-time 120 \
            -X POST "$BACKEND_URL/api/refresh?token=$REFRESH_TOKEN")
          if [ "$trigger_status" != "200" ]; then
            echo "触发失败，HTTP状态码: $trigger_status"
            exit 1
          fi
          echo "已触发，开始轮询进度（每2分钟查一次，这个轮询本身也能防止Render免费层把服务闲置睡着导致后台任务被杀掉）..."

          # 最多等 70 分钟（35次 * 2分钟）。实测跑一次大概要40多分钟，这里留出余量，
          # 避免刚好卡在临界点被误判成失败（之前40分钟上限时就踩过这个坑）
          for i in $(seq 1 35); do
            sleep 120
            resp=$(curl -s --max-time 60 "$BACKEND_URL/api/refresh/status")
            echo "[第${i}次轮询] $resp"
            status=$(echo "$resp" | grep -o '"status":"[a-z_]*"' | cut -d'"' -f4)

            if [ "$status" = "done" ]; then
              echo "✅ 刷新成功完成"
              exit 0
            elif [ "$status" = "done_but_empty" ]; then
              echo "⚠️ 跑完了，但这次一场比赛都没处理到（matchesProcessed=0），可能数据源那边有问题，需要去看后端日志"
              exit 1
            elif [ "$status" = "error" ]; then
              echo "❌ 刷新过程中出错了"
              exit 1
            fi
            # status还是running，继续下一轮轮询
          done

          echo "⏱️ 等了70分钟还没跑完，可能是真的卡住了，去Render后台查一下日志"
          exit 1
