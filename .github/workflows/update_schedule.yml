name: Trigger Backend Refresh

on:
  schedule:
    # 每天 UTC 06:00 跑一次（可自行调整，UTC时间要自己换算成你想要的当地时间）
    - cron: '0 6 * * *'
  workflow_dispatch: {}   # 也支持在GitHub网页上手动点一下立即跑一次

jobs:
  trigger-refresh:
    runs-on: ubuntu-latest
    steps:
      - name: 调用后端 /api/refresh 接口
        env:
          BACKEND_URL: ${{ secrets.BACKEND_URL }}
          REFRESH_TOKEN: ${{ secrets.REFRESH_TOKEN }}
        run: |
          echo "调用 $BACKEND_URL/api/refresh ..."
          # Render免费层服务闲置会休眠，首次唤醒可能要等几十秒，超时设长一点
          response=$(curl -s -w "\nHTTP_STATUS:%{http_code}" --max-time 180 \
            -X POST "$BACKEND_URL/api/refresh?token=$REFRESH_TOKEN")
          echo "$response"
          status=$(echo "$response" | grep "HTTP_STATUS" | cut -d: -f2)
          if [ "$status" != "200" ]; then
            echo "刷新失败，HTTP状态码: $status"
            exit 1
          fi
