name: Update Football Schedule

on:
  schedule:
    # 每天 UTC 06:00 跑一次（可自行调整，UTC时间要自己换算成你想要的当地时间）
    - cron: '0 6 * * *'
  workflow_dispatch: {}   # 也支持在GitHub网页上手动点一下立即跑一次

permissions:
  contents: write

jobs:
  update-schedule:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: pip install requests geopy

      - name: 生成 schedule.json
        env:
          MOCK_MODE: "false"
          FOOTBALL_DATA_API_KEY: ${{ secrets.FOOTBALL_DATA_API_KEY }}
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: python scripts/export_schedule_json.py

      - name: 提交更新后的 schedule.json 和历史归档
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/schedule.json docs/history/
          git diff --staged --quiet || git commit -m "自动更新赛程数据 $(date -u +%Y-%m-%d)"
          git push
